[package]
name = "laburo"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A local-first TQA suite for a solo developer: cases, runs, evidence, bugs, and Typst reports."
publish = false

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.29.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.0"
ureq = { version = "3.5.2", features = ["json"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dev-dependencies]
tempfile = "3.27.0"
