[package]
name = "laburo"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A local-first TQA suite for a solo developer: cases, runs, evidence, bugs, and Typst reports."
publish = false

[dependencies]
anyhow = "1.0"
axum = { version = "0.8.9", features = ["multipart"] }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29.0"
mail-builder = "2.0.1"
minijinja = { version = "3.1.0", features = ["serde", "json", "urlencode"] }
ratatui = "0.29.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.0"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs"] }
ureq = { version = "3.5.2", features = ["json"] }
urlencoding = "2.1.3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
